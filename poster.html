<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blueprint AR · Poster</title>
<style>
  html,body{margin:0;height:100%;background:#111;}
  body{display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif}
  img{max-height:100vh;max-width:100vw;display:block}
  p{position:fixed;bottom:12px;left:0;right:0;text-align:center;color:#888;font-size:13px;margin:0;transition:opacity .6s}
</style></head>
<body>
  <img src="assets/poster.jpg" alt="Empire State Building poster">
  <p id="tip">Turn brightness up, then scan this screen with your phone. Click to go full screen.</p>
  <script>
    document.body.addEventListener('click', () => document.documentElement.requestFullscreen?.());
    setTimeout(() => document.getElementById('tip').style.opacity = 0, 6000);
  </script>
</body></html>
